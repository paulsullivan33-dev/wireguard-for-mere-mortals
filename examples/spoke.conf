# spoke.conf — a wg-quick config for the spoke (the laptop, the
# traveller, the machine behind NAT). Copy to
# /etc/wireguard/wg0.conf on the spoke, replace every <...>
# placeholder, then: wg-quick up wg0
#
# The spoke is the side that initiates, so it is the side that
# needs the Endpoint.

[Interface]
PrivateKey = <spoke private key>
Address = 10.99.0.2/24
# Optional on the spoke. Set it only if something needs to
# reach the spoke first, or your firewall bookkeeping wants
# a fixed source port.
ListenPort = 51821
# Send DNS queries through the tunnel to the hub's resolver.
# Remove this line if the hub does not run a resolver for
# you — see the DNS chapter before deciding.
DNS = 10.99.0.1

[Peer]
# The hub.
PublicKey = <hub public key>
PresharedKey = <preshared key for the hub<->spoke pair>
# The hub's public address (or name) and port. On the guide's
# one-machine lab this was 127.0.0.1:51820; on a real network
# it is the hub's reachable address — the one piece of this
# file that points outside the tunnel.
Endpoint = <hub public address>:51820
# Split tunnel: only the hub itself is reached through the
# tunnel. For a full tunnel (everything through the hub),
# replace with 0.0.0.0/0 — read the full/split chapter first.
AllowedIPs = 10.99.0.1/32
# The spoke sits behind NAT, whose mapping forgets idle UDP.
# A tiny empty packet every 25 seconds keeps the path open
# so the hub can still reach in. Hub side needs no keepalive.
PersistentKeepalive = 25
