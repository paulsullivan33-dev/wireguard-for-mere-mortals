# hub.conf — a wg-quick config for the hub (the machine with the
# stable address). Copy to /etc/wireguard/wg0.conf on the hub,
# replace every <...> placeholder, then: wg-quick up wg0
#
# The hub mostly waits. It has no Endpoint for its peers — it
# learns where a peer currently is from the peer's own packets.

[Interface]
# This machine's private key (from: wg genkey). Never share it,
# never paste it into chat or a ticket.
PrivateKey = <hub private key>
# The hub's address inside the tunnel. /24 here describes the
# tunnel subnet to wg-quick; each machine owns exactly one
# address in it.
Address = 10.99.0.1/24
ListenPort = 51820

[Peer]
# The spoke. One [Peer] block per machine allowed to connect.
PublicKey = <spoke public key>
# Optional but recommended: the preshared key for THIS pair
# (from: wg genpsk). Every pair gets its own.
PresharedKey = <preshared key for the hub<->spoke pair>
# Which tunnel addresses this peer may claim — exactly one.
AllowedIPs = 10.99.0.2/32
